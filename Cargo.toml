[package]
name = "uas-cot"
version = "0.4.0"
authors = ["Matt Busel <matt@busel.dev>"]
edition = "2021"
rust-version = "1.70"
description = "Your TAK map shows fake drones as real ones: open Remote ID receivers flagged 0 of 10 spoofed drones. uas-cot puts a trust verdict on Remote ID markers. Drone telemetry to Cursor on Target: Remote ID (remoteid spoof verdicts), MISB ST 0601 KLV (STANAG 4609), MAVLink and MAVLink-M friendly position reports to ATAK/WinTAK/TAK Server; targeting and engagement messages refused at compile time"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Mattbusel/uas-cot"
homepage = "https://github.com/Mattbusel/uas-cot"
documentation = "https://docs.rs/uas-cot"
readme = "README.md"
keywords = ["cot", "tak", "remote-id", "counter-uas", "mavlink"]
categories = ["aerospace::drones", "aerospace::protocols", "command-line-utilities", "network-programming"]
exclude = ["tests/data/*", "tests/schema/*", ".github", "tools", "docs/*.gif"]

[features]
default = ["remoteid", "misb", "cli"]
## Remote ID to CoT (`rid` module).
remoteid = ["dep:remoteid"]
## MISB ST 0601 KLV to CoT (`fmv` module).
misb = ["dep:misb"]
## The `uas2cot` binary (needs remoteid, misb and mavlink-tlog).
cli = ["remoteid", "misb", "dep:mavlink-tlog"]
## MAVLink-M (Dronecode `military.xml`) friendly position reports to CoT,
## and the framing checker (`mavlink_m` module, `mavlinkm-check` binary
## with `cli`). Target, track, fires, engagement and payload messages are
## refused.
mavlink-m = ["dep:roxmltree"]

[dev-dependencies]
mavlink-tlog = "0.1"

[dependencies]
remoteid = { version = "0.2", optional = true }
misb = { version = "0.1.1", optional = true }
mavlink-tlog = { version = "0.1", optional = true }
roxmltree = { version = "0.21", optional = true }

[[bin]]
name = "uas2cot"
required-features = ["cli"]

[[bin]]
name = "mavlinkm-check"
required-features = ["cli", "mavlink-m"]

[[example]]
name = "rid_to_cot"
required-features = ["remoteid"]

[[example]]
name = "mavlink_m_sim"
required-features = ["mavlink-m", "cli"]

[package.metadata.docs.rs]
all-features = true
