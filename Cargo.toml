[package]
name = "uas-cot"
version = "0.2.1"
authors = ["Matt Busel <matt@busel.dev>"]
edition = "2021"
rust-version = "1.70"
description = "Drone telemetry to Cursor on Target (CoT) for TAK: Remote ID, MISB ST 0601 KLV (STANAG 4609 video), MAVLink vehicle telemetry and MAVLink-M (military.xml) friendly position reports to ATAK/WinTAK/TAK Server, with a MAVLink-M framing checker and the uas2cot command line bridge. Telemetry and position interoperability only"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Mattbusel/uas-cot"
homepage = "https://github.com/Mattbusel/uas-cot"
documentation = "https://docs.rs/uas-cot"
readme = "README.md"
keywords = ["cot", "tak", "mavlink", "remote-id", "mavlink-m"]
categories = ["aerospace::drones", "aerospace::protocols", "command-line-utilities", "network-programming"]
exclude = ["tests/data/*", "tests/schema/*", ".github", "tools", "docs/*.gif"]

[features]
default = ["remoteid", "misb", "cli"]
## Remote ID to CoT (`rid` module).
remoteid = ["dep:remoteid"]
## MISB ST 0601 KLV to CoT (`fmv` module).
misb = ["dep:misb"]
## The `uas2cot` binary (needs remoteid, misb and mavlink-tlog).
cli = ["remoteid", "misb", "dep:mavlink-tlog"]
## MAVLink-M (Dronecode `military.xml`) friendly position reports to CoT,
## and the framing checker (`mavlink_m` module, `mavlinkm-check` binary
## with `cli`). Target, track, fires and engagement messages are refused.
mavlink-m = ["dep:roxmltree"]

[dev-dependencies]
mavlink-tlog = "0.1"

[dependencies]
remoteid = { version = "0.1", optional = true }
misb = { version = "0.1", optional = true }
mavlink-tlog = { version = "0.1", optional = true }
roxmltree = { version = "0.21", optional = true }

[[bin]]
name = "uas2cot"
required-features = ["cli"]

[[bin]]
name = "mavlinkm-check"
required-features = ["cli", "mavlink-m"]

[[example]]
name = "mavlink_m_sim"
required-features = ["mavlink-m", "cli"]

[package.metadata.docs.rs]
all-features = true
